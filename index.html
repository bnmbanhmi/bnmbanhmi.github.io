<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>bnmbanhmi</title>
    <link rel="canonical" href="https://blog.minhbach.net" />
    <style>
        :root {
            --bg-color: #FDF6F0;
            --accent-color: #FF7A5C;
            --card-top: #FF9A85;
            --card-bottom-strip: #FF9A85;
            --card-body: #FFF1E6;
            --text-color: #7A6863;
            --muted-color: #BFAAA5;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Fullpage Native Scroll-Snap Container (Apple Trackpad / 120Hz ProMotion Native Physics) */
        #slider-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            position: relative;
        }

        #slider-container::-webkit-scrollbar {
            display: none;
        }

        .section-page {
            width: 100%;
            height: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            padding-bottom: max(40px, env(safe-area-inset-bottom, 20px));
            padding-top: max(40px, env(safe-area-inset-top, 20px));
            position: relative;
            overflow: hidden;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 440px;
            position: relative;
            will-change: transform, opacity;
        }

        /* Static Page Hints (Top & Bottom) - Motionless, clean */
        .page-hint {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--muted-color);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 45;
            transition: color 0.25s ease;
            white-space: nowrap;
        }

        .page-hint:hover {
            color: var(--accent-color);
        }

        .page-hint.hint-top {
            top: max(32px, env(safe-area-inset-top, 16px));
            flex-direction: column;
        }

        .hint-label {
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            display: inline-block;
            transition: color 0.25s ease;
        }

        .hint-arrow {
            display: block;
            opacity: 0.8;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .page-hint:hover .hint-arrow {
            opacity: 1;
            transform: scale(1.15);
        }

        /* ── Continuous Morphing Shared Elements ── */
        .morph-element {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            white-space: nowrap;
            will-change: top, transform, opacity, font-size, color;
        }

        .morph-element .morph-label {
            display: inline-block;
            letter-spacing: 0.5px;
            line-height: 1.2;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        .morph-element .morph-arrow {
            display: block;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        #morph-thoughts:hover .morph-label {
            color: var(--accent-color) !important;
            border-color: var(--accent-color) !important;
        }

        #morph-nowplaying:hover .morph-label {
            color: var(--accent-color) !important;
        }

        /* Page 1: Hello Card (Original clean card) */
        .hello-card {
            width: 300px;
            background-color: var(--card-body);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(122, 104, 99, 0.12);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            will-change: transform, opacity;
        }

        .hello-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(122, 104, 99, 0.16);
        }

        .card-top {
            background-color: var(--card-top);
            color: #fff;
            text-align: center;
            padding: 14px 0 10px 0;
        }

        .card-top .hello-text {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            line-height: 1.2;
        }

        .card-top .subtitle-text {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-top: 2px;
            opacity: 0.9;
        }

        .card-body {
            padding: 18px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            background-color: var(--card-body);
        }

        .card-bottom-strip {
            background-color: var(--card-bottom-strip);
            height: 22px;
        }

        .handwriting-svg {
            width: 200px;
            height: auto;
            display: block;
        }

        .name-path {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Page 2: Feed Section & Spacers */
        .morph-thoughts-spacer {
            width: 100%;
            height: 32px;
            margin-bottom: 28px;
        }

        .feed-section {
            width: 100%;
            max-width: 380px;
            text-align: left;
            will-change: transform, opacity;
        }

        .post-item {
            margin-bottom: 22px;
        }

        .post-item h3 {
            margin: 0 0 4px 0;
            font-weight: 400;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .post-item h3 a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .post-item h3 a:hover {
            color: var(--accent-color);
        }

        .date {
            font-size: 0.75rem;
            color: var(--muted-color);
            display: block;
        }

        .loading {
            color: var(--muted-color);
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
        }

        /* Page 3: Spotify */
        .spotify-wrapper {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .morph-nowplaying-spacer {
            width: 100%;
            height: 26px;
            margin-bottom: 22px;
        }

        #spotify-player-container {
            min-height: 352px;
            width: 100%;
            transition: opacity 0.5s ease-out;
            opacity: 0;
            will-change: transform, opacity;
        }

        #spotify-player-container.loaded {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .page-hint.hint-top {
                top: max(22px, env(safe-area-inset-top, 14px));
            }
            .hello-card {
                width: 280px;
            }
            .handwriting-svg {
                width: 185px;
            }
            .feed-section {
                max-width: 320px;
            }
            .spotify-wrapper {
                max-width: 300px;
            }
        }

        /* Blog View Mode (?post=slug) */
        body.blog-view {
            overflow: auto !important;
            height: auto !important;
            min-height: 100vh;
            padding: 40px 20px;
            display: block;
        }

        body.blog-view #slider-container,
        body.blog-view .morph-element,
        body.blog-view .page-hint {
            display: none !important;
        }

        #blog-content {
            display: none;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        body.blog-view #blog-content {
            display: block;
        }

        .back-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        #post-body {
            line-height: 1.8;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        #post-body h1,
        #post-body h2,
        #post-body h3 {
            font-weight: 600;
            color: #5C4A45;
            margin-top: 2em;
        }

        #post-body h1 { font-size: 1.5rem; }
        #post-body h2 { font-size: 1.25rem; }
        #post-body h3 { font-size: 1.1rem; }
        #post-body p { margin: 1.2em 0; }
        #post-body a { color: var(--accent-color); }
        #post-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1.5em 0;
        }
        #post-body blockquote {
            border-left: 3px solid var(--accent-color);
            margin: 1.5em 0;
            padding: 0.5em 1em;
            background: var(--card-body);
            border-radius: 0 8px 8px 0;
        }
        #post-body code {
            background: var(--card-body);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        #post-body pre code {
            display: block;
            padding: 1em;
            overflow-x: auto;
        }
        #post-body ul, #post-body ol {
            padding-left: 1.5em;
        }
        #post-body li {
            margin: 0.5em 0;
        }
    </style>
</head>

<body>

    <script src="marked.min.js"></script>
    <script>
        // ── Blog routing (query param) ──
        (function () {
            const params = new URLSearchParams(window.location.search);
            const post = params.get('post');

            if (post) {
                document.body.classList.add('blog-view');
                document.title = post.replace(/-/g, ' ') + ' — bnmbanhmi';

                fetch('posts/' + post + '.md')
                    .then(r => {
                        if (!r.ok) throw new Error('not found');
                        return r.text();
                    })
                    .then(md => {
                        document.getElementById('post-body').innerHTML = marked.parse(md);
                    })
                    .catch(() => {
                        document.getElementById('post-body').innerHTML = '<p>post not found.</p>';
                    });
            }
        })();

        // ── Handwriting animation (extracted verbatim from HandwritingCard.tsx) ──
        const STROKES = [
  "m-1", "m-2", "m-3", // m
  "i-1", "i-2",        // i
  "n-1", "n-2",        // n
  "h1-1", "h1-2",      // h
  "b-1", "b-2",        // b
  "a-1", "a-2",        // a
  "c-1",               // c
  "h2-1", "h2-2",      // h
];

        const msPerUnit = 11;
        const strokeGap = 20;
        let handwritingTimers = [];

        function initPaths() {
            const svg = document.getElementById('handwriting-svg');
            if (!svg) return;
            STROKES.forEach(id => {
                const path = svg.querySelector('#' + id);
                if (path) {
                    const len = path.getTotalLength();
                    path.style.strokeDasharray = len;
                    path.style.strokeDashoffset = len;
                    path.style.transition = 'none';
                }
            });
        }

        function animateWrite() {
            const svg = document.getElementById('handwriting-svg');
            if (!svg) return;

            // Clear any pending timers
            handwritingTimers.forEach(t => clearTimeout(t));
            handwritingTimers = [];

            // Reset stroke styles
            STROKES.forEach(id => {
                const path = svg.querySelector('#' + id);
                if (path) {
                    const len = path.getTotalLength();
                    path.style.strokeDasharray = len;
                    path.style.strokeDashoffset = len;
                    path.style.transition = 'none';
                }
            });

            // Force reflow
            void svg.getBoundingClientRect();

            // Constant linear speed: constant milliseconds per pixel across all strokes
            let cumDelay = 0;
            STROKES.forEach(id => {
                const path = svg.querySelector('#' + id);
                if (!path) return;

                const len = path.getTotalLength();
                // Constant velocity across all curves and lines
                const dur = id === 'i-2' ? 80 : Math.max(80, Math.round(len * msPerUnit));

                const timer = setTimeout(() => {
                    if (path) {
                        path.style.transition = `stroke-dashoffset ${dur}ms linear`;
                        path.style.strokeDashoffset = '0';
                    }
                }, cumDelay);

                handwritingTimers.push(timer);

                // Subtle natural pen-lift pause between "minh" and "bach"
                const extraGap = id === 'h1-2' ? 120 : 0;
                cumDelay += dur + strokeGap + extraGap;
            });
        }

        // Card interaction (click / hover)
        const card = document.getElementById('helloCard');
        if (card) {
            card.addEventListener('mouseenter', animateWrite);
            card.addEventListener('click', animateWrite);
        }

        // ── Smooth Native Scroll & True Morphing Shared Elements Engine ──
        const sliderContainer = document.getElementById('slider-container');
        const helloCard = document.getElementById('helloCard');

        const morphThoughts = document.getElementById('morph-thoughts');
        const morphThoughtsLabel = document.getElementById('morph-thoughts-label');
        const morphThoughtsArrowUp = morphThoughts.querySelector('.morph-arrow-up');
        const morphThoughtsArrowDown = morphThoughts.querySelector('.morph-arrow-down');

        const morphNowplaying = document.getElementById('morph-nowplaying');
        const morphNowplayingLabel = document.getElementById('morph-nowplaying-label');
        const morphNowplayingArrowDown = morphNowplaying.querySelector('.morph-arrow-down');

        const hintP2Top = document.getElementById('hint-p2-top');
        const thoughtsFeedSection = document.getElementById('thoughts-feed-section');
        const spotifyContainer = document.getElementById('spotify-player-container');

        let activePageIndex = 0;
        let hasAnimatedP0 = false;

        function scrollToPage(index) {
            const vh = sliderContainer.clientHeight;
            sliderContainer.scrollTo({
                top: index * vh,
                behavior: 'smooth'
            });
        }

        // Color interpolation helper
        function lerpColor(r1, g1, b1, r2, g2, b2, t) {
            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Relative offset of anchor inside its parent section
        function getAnchorRelativeY(anchorId, sectionId) {
            const anchor = document.getElementById(anchorId);
            const section = document.getElementById(sectionId);
            if (!anchor || !section) return 0;
            const aRect = anchor.getBoundingClientRect();
            const sRect = section.getBoundingClientRect();
            return aRect.top - sRect.top;
        }

        function updateMorphPositions() {
            const vh = sliderContainer.clientHeight || window.innerHeight;
            const scrollTop = sliderContainer.scrollTop;
            const progress = scrollTop / vh; // 0.0 to 2.0

            // Safe bottom margin that keeps text & arrow well above screen edge & home bar
            const safeBottomPadding = Math.max(76, (window.innerHeight < 700 ? 76 : 86));
            const y_bottom = vh - safeBottomPadding;

            // Dynamically computed anchor targets based on actual DOM layout
            const y_page2_center = getAnchorRelativeY('thoughts-anchor', 'page-thoughts') || (vh * 0.36);
            const y_page3_center = getAnchorRelativeY('nowplaying-anchor', 'page-nowplaying') || (vh * 0.22);
            const y_top = (vh < 650 ? 22 : 32);

            // 1. Morphing Element 1: "read my thoughts"
            if (progress <= 1.0) {
                const t = Math.max(0, Math.min(1, progress));
                // Physical position lerps smoothly from comfortable bottom to Page 2 anchor
                const currentY = (1 - t) * y_bottom + t * y_page2_center;
                morphThoughts.style.top = `${currentY}px`;

                // Font size scales from 0.88rem to 1.05rem
                const fontSize = 0.88 + t * (1.05 - 0.88);
                morphThoughtsLabel.style.fontSize = `${fontSize}rem`;

                // Color morphs from muted (#BFAAA5 = 191,170,165) to text-color (#7A6863 = 122,104,99)
                morphThoughts.style.color = lerpColor(191, 170, 165, 122, 104, 99, t);

                // Underline color MATCHES the text color (#7A6863 = 122, 104, 99)
                if (t > 0.4) {
                    const borderOpacity = (t - 0.4) / 0.6;
                    morphThoughtsLabel.style.borderBottom = `1px solid rgba(122, 104, 99, ${borderOpacity})`;
                } else {
                    morphThoughtsLabel.style.borderBottom = '1px solid transparent';
                }

                // Arrow down fades out early in the ascent
                morphThoughtsArrowDown.style.opacity = Math.max(0, 1 - t * 3.5);
                morphThoughtsArrowUp.style.opacity = '0';

                // Hello card fades and slightly lifts
                helloCard.style.transform = `translateY(${-t * 35}px) scale(${1 - t * 0.04})`;
                helloCard.style.opacity = Math.max(0, 1 - t * 1.5);

                // Feed section enters smoothly below the morphing title
                if (thoughtsFeedSection) {
                    const feedOffset = (1 - t) * 55;
                    thoughtsFeedSection.style.transform = `translateY(${feedOffset}px)`;
                    thoughtsFeedSection.style.opacity = Math.max(0, Math.min(1, (t - 0.3) * 1.6));
                }

                // Top hint (HELLO) fades in cleanly as we reach Page 2
                if (hintP2Top) {
                    hintP2Top.style.opacity = Math.max(0, Math.min(1, (t - 0.45) * 2));
                }
            } else {
                const t = Math.max(0, Math.min(1, progress - 1.0));
                // Physical position lerps smoothly from Page 2 center up to top hint position
                const currentY = (1 - t) * y_page2_center + t * y_top;
                morphThoughts.style.top = `${currentY}px`;

                // Font size scales from 1.05rem down to 0.88rem
                const fontSize = 1.05 - t * (1.05 - 0.88);
                morphThoughtsLabel.style.fontSize = `${fontSize}rem`;

                // Color morphs from text-color (#7A6863 = 122,104,99) back to muted (#BFAAA5 = 191,170,165)
                morphThoughts.style.color = lerpColor(122, 104, 99, 191, 170, 165, t);

                // Underline fades out
                const borderOpacity = Math.max(0, 1 - t * 2.5);
                morphThoughtsLabel.style.borderBottom = `1px solid rgba(122, 104, 99, ${borderOpacity})`;

                // Arrow up fades in as we approach top of Page 3
                morphThoughtsArrowDown.style.opacity = '0';
                morphThoughtsArrowUp.style.opacity = Math.max(0, Math.min(1, (t - 0.4) * 2));

                // Feed section fades out
                if (thoughtsFeedSection) {
                    thoughtsFeedSection.style.opacity = Math.max(0, 1 - t * 1.6);
                }

                // Top hint (HELLO) fades out
                if (hintP2Top) {
                    hintP2Top.style.opacity = Math.max(0, 1 - t * 2.5);
                }
            }

            // 2. Morphing Element 2: "now playing"
            if (progress < 0.6) {
                // Hidden on Page 1
                morphNowplaying.style.opacity = '0';
                morphNowplaying.style.pointerEvents = 'none';
            } else if (progress <= 1.0) {
                // Fades in at bottom of Page 2
                const t = (progress - 0.6) / 0.4;
                morphNowplaying.style.top = `${y_bottom}px`;
                morphNowplaying.style.opacity = `${t}`;
                morphNowplaying.style.pointerEvents = 'auto';
                morphNowplaying.style.color = 'var(--muted-color)';
                morphNowplayingLabel.style.fontSize = '0.88rem';
                morphNowplayingArrowDown.style.opacity = `${t}`;
            } else {
                const t = Math.max(0, Math.min(1, progress - 1.0));
                // Physical position lerps smoothly from bottom up to dynamically measured Spotify title position
                const currentY = (1 - t) * y_bottom + t * y_page3_center;
                morphNowplaying.style.top = `${currentY}px`;
                morphNowplaying.style.opacity = '1';
                morphNowplaying.style.pointerEvents = (t > 0.8) ? 'none' : 'auto';

                // Font size scales from 0.88rem to 1.0rem
                const fontSize = 0.88 + t * (1.0 - 0.88);
                morphNowplayingLabel.style.fontSize = `${fontSize}rem`;

                // Color morphs from muted (#BFAAA5 = 191,170,165) to text-color (#7A6863 = 122,104,99)
                // EXACTLY MATCHING "read my thoughts" text color!
                morphNowplaying.style.color = lerpColor(191, 170, 165, 122, 104, 99, t);

                // Arrow down fades out
                morphNowplayingArrowDown.style.opacity = Math.max(0, 1 - t * 3.5);

                // Spotify container settles into place
                if (spotifyContainer) {
                    const spotOffset = (1 - t) * 55;
                    spotifyContainer.style.transform = `translateY(${spotOffset}px)`;
                    spotifyContainer.style.opacity = Math.max(0, Math.min(1, (t - 0.25) * 1.5));
                }
            }

            // 3. Update active page index
            const newIndex = Math.round(progress);
            if (newIndex !== activePageIndex) {
                activePageIndex = newIndex;

                // Auto-replay handwriting animation when landing back on Page 0
                if (activePageIndex === 0 && hasAnimatedP0) {
                    setTimeout(animateWrite, 150);
                }
            }
        }

        // RequestAnimationFrame scroll listener for 120Hz continuous tracking
        let isTicking = false;
        sliderContainer.addEventListener('scroll', () => {
            if (!isTicking) {
                requestAnimationFrame(() => {
                    updateMorphPositions();
                    isTicking = false;
                });
                isTicking = true;
            }
        }, { passive: true });

        // Click on hint-p2-top
        hintP2Top.addEventListener('click', () => {
            scrollToPage(0);
        });

        // Click on morph-thoughts
        morphThoughts.addEventListener('click', (e) => {
            const vh = sliderContainer.clientHeight;
            const progress = sliderContainer.scrollTop / vh;
            if (progress < 0.4) {
                // On Page 1 -> scroll to Page 2
                e.preventDefault();
                scrollToPage(1);
            } else if (progress > 1.6) {
                // On Page 3 -> scroll back to Page 2
                e.preventDefault();
                scrollToPage(1);
            }
            // Otherwise on Page 2: opens Substack link normally!
        });

        // Click on morph-nowplaying
        morphNowplaying.addEventListener('click', (e) => {
            const vh = sliderContainer.clientHeight;
            const progress = sliderContainer.scrollTop / vh;
            if (progress < 1.4) {
                // On Page 2 -> scroll to Page 3
                e.preventDefault();
                scrollToPage(2);
            }
        });

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (document.body.classList.contains('blog-view')) return;
            if (['ArrowDown', 'PageDown', ' '].includes(e.key)) {
                e.preventDefault();
                if (activePageIndex < 2) scrollToPage(activePageIndex + 1);
            } else if (['ArrowUp', 'PageUp'].includes(e.key)) {
                e.preventDefault();
                if (activePageIndex > 0) scrollToPage(activePageIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                scrollToPage(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                scrollToPage(2);
            }
        });

        // ── Substack feed ──
        const rssUrl = 'https://bnmbanhmi.substack.com/feed';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('substack-feed');
                if (!container) return;
                container.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<p class="loading">nothing yet.</p>';
                    return;
                }

                const posts = data.items.slice(0, 3);

                posts.forEach(post => {
                    let dateObj = new Date(post.pubDate.replace(/-/g, '/'));
                    let pubDate = dateObj.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });

                    container.innerHTML += `
                        <div class="post-item">
                            <h3><a href="${post.link}" target="_blank">${post.title.toLowerCase()}</a></h3>
                            <span class="date">${pubDate}</span>
                        </div>
                    `;
                });
            })
            .catch(error => {
                const container = document.getElementById('substack-feed');
                if (container) container.innerHTML = '';
            });

        // ── Spotify Player ──
        const spotifyLink = 'https://open.spotify.com/track/456WNXWhDwYOSf5SpTuqxd?si=c63f8c5cfdcf4a49';

        function extractSpotifyId(url) {
            const match = url.match(/track\/([a-zA-Z0-9]+)/);
            return match ? match[1] : null;
        }

        function loadSpotifyTrack(url) {
            const container = document.getElementById('spotify-player-container');
            if (!container) return;
            const trackId = extractSpotifyId(url) || '456WNXWhDwYOSf5SpTuqxd';
            const embedUrl = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator`;

            container.classList.remove('loaded');

            setTimeout(() => {
                const iframe = document.createElement('iframe');
                iframe.setAttribute('data-testid', 'embed-iframe');
                iframe.style.borderRadius = '12px';
                iframe.src = embedUrl;
                iframe.width = '100%';
                iframe.height = '352';
                iframe.frameBorder = '0';
                iframe.allowFullscreen = '';
                iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
                iframe.loading = 'lazy';

                iframe.onload = () => {
                    container.classList.add('loaded');
                };

                container.innerHTML = '';
                container.appendChild(iframe);

                setTimeout(() => {
                    if (!container.classList.contains('loaded')) {
                        container.classList.add('loaded');
                    }
                }, 2000);
            }, 400);
        }

        // ── Window Resize & Init ──
        window.addEventListener('resize', () => {
            updateMorphPositions();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initPaths();
            setTimeout(() => {
                animateWrite();
                hasAnimatedP0 = true;
            }, 300);

            loadSpotifyTrack(spotifyLink);
            updateMorphPositions();
        });
    </script>
</body>

</html>
