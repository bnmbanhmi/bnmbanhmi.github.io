<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bnmbanhmi</title>
    <link rel="canonical" href="https://bnmbanhmi.me" />
    <style>
        :root {
            --bg-color: #FDF6F0;
            --accent-color: #FF7A5C;
            --card-top: #FF9A85;
            --card-bottom-strip: #FF9A85;
            --card-body: #FFF1E6;
            --text-color: #7A6863;
            --muted-color: #BFAAA5;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .hello-card {
            width: 300px;
            background-color: var(--card-body);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(122, 104, 99, 0.1);
            margin-bottom: 40px;
            cursor: pointer;
        }

        .card-top {
            background-color: var(--card-top);
            color: #fff;
            text-align: center;
            padding: 14px 0 10px 0;
        }

        .card-top .hello-text {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            line-height: 1.2;
        }

        .card-top .subtitle-text {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-top: 2px;
            opacity: 0.9;
        }

        .card-body {
            padding: 18px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            background-color: var(--card-body);
        }

        .card-bottom-strip {
            background-color: var(--card-bottom-strip);
            height: 22px;
        }

        .handwriting-svg {
            width: 200px;
            height: auto;
        }

        .name-path {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .main-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 2px;
            transition: all 0.3s ease;
            margin-bottom: 50px;
        }

        .main-link:hover {
            color: var(--accent-color);
            border-bottom-width: 2px;
        }

        .feed-section {
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        .post-item {
            margin-bottom: 20px;
        }

        .post-item h3 {
            margin: 0 0 4px 0;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .post-item h3 a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-item h3 a:hover {
            color: var(--accent-color);
        }

        .date {
            font-size: 0.75rem;
            color: var(--muted-color);
            display: block;
        }

        .loading {
            color: var(--muted-color);
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
        }

        .spotify-wrapper {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .player-title {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            opacity: 0.9;
        }

        #spotify-player-container {
            min-height: 352px;
            width: 100%;
            transition: opacity 0.5s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(-40px);
        }

        #spotify-player-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        body.blog-view {
            justify-content: flex-start;
        }

        #home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #home-content.hidden {
            display: none;
        }

        #blog-content {
            display: none;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        #blog-content.visible {
            display: block;
        }

        .back-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        #post-body {
            line-height: 1.8;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        #post-body h1,
        #post-body h2,
        #post-body h3 {
            font-weight: 600;
            color: #5C4A45;
            margin-top: 2em;
        }

        #post-body h1 {
            font-size: 1.5rem;
        }

        #post-body h2 {
            font-size: 1.25rem;
        }

        #post-body h3 {
            font-size: 1.1rem;
        }

        #post-body p {
            margin: 1.2em 0;
        }

        #post-body a {
            color: var(--accent-color);
        }

        #post-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1.5em 0;
        }

        #post-body blockquote {
            border-left: 3px solid var(--accent-color);
            margin: 1.5em 0;
            padding: 0.5em 1em;
            background: var(--card-body);
            border-radius: 0 8px 8px 0;
        }

        #post-body code {
            background: var(--card-body);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        #post-body pre code {
            display: block;
            padding: 1em;
            overflow-x: auto;
        }

        #post-body ul,
        #post-body ol {
            padding-left: 1.5em;
        }

        #post-body li {
            margin: 0.5em 0;
        }
    </style>
</head>

<body>

    <div id="home-content">

        <div class="hello-card" id="helloCard">
            <div class="card-top">
                <span class="hello-text">Hello</span>
                <span class="subtitle-text">my name is</span>
            </div>
            <div class="card-body">
                <svg class="handwriting-svg" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(31, 0)">
                        <!-- b: stroke 1 = vertical, stroke 2 = belly -->
                        <path class="name-path" id="b-1" d="M12,12 L12,58" />
                        <path class="name-path" id="b-2"
                            d="M12,35 C12,28 22,22 26,30 C30,38 28,48 22,52 C16,56 12,52 12,48" />
                        <!-- a: stroke 1 = circle, stroke 2 = tail -->
                        <path class="name-path" id="a-1"
                            d="M48,32 C44,28 36,28 34,35 C32,42 34,52 40,54 C46,56 50,50 48,42 L48,32" />
                        <path class="name-path" id="a-2" d="M48,32 L48,56" />
                        <!-- n: stroke 1 = vertical, stroke 2 = hump -->
                        <path class="name-path" id="n-1" d="M58,32 L58,56" />
                        <path class="name-path" id="n-2" d="M58,38 C58,30 66,28 70,34 C74,40 72,56 72,56" />
                        <!-- h: stroke 1 = tall vertical, stroke 2 = hump -->
                        <path class="name-path" id="h-1" d="M82,12 L82,56" />
                        <path class="name-path" id="h-2" d="M82,38 C82,30 90,28 94,34 C98,40 96,56 96,56" />
                        <!-- m: stroke 1 = vertical, stroke 2 = first hump, stroke 3 = second hump -->
                        <path class="name-path" id="m-1" d="M106,32 L106,56" />
                        <path class="name-path" id="m-2" d="M106,38 C106,30 114,28 116,34 C118,40 118,42 118,42" />
                        <path class="name-path" id="m-3"
                            d="M118,42 C118,34 120,28 126,28 C132,28 134,36 134,42 L134,56" />
                        <!-- i: stroke 1 = body, stroke 2 = dot -->
                        <path class="name-path" id="i-1" d="M144,32 L144,56" />
                        <path class="name-path" id="i-2" d="M144,22 L144.5,22.5" />
                    </g>
                </svg>
            </div>
            <div class="card-bottom-strip"></div>
        </div>

        <a href="https://bnmbanhmi.substack.com" target="_blank" class="main-link">read my thoughts</a>

        <div class="feed-section">
            <div id="substack-feed" class="loading">...</div>
        </div>

        <!-- Spotify Player -->
        <div class="spotify-wrapper">
            <span class="player-title">now playing</span>
            <div id="spotify-player-container" style="width: 100%;"></div>
        </div>
    </div>

    <!-- Blog content (hidden by default, shown via ?post= param) -->
    <div id="blog-content">
        <a href="/" class="back-link">back</a>
        <article id="post-body"></article>
    </div>

    <script src="marked.min.js"></script>
    <script>
        // ── Blog routing (query param) ──
        (function () {
            const params = new URLSearchParams(window.location.search);
            const post = params.get('post');

            if (post) {
                document.getElementById('home-content').classList.add('hidden');
                document.getElementById('blog-content').classList.add('visible');
                document.body.classList.add('blog-view');
                document.title = post.replace(/-/g, ' ') + ' — bnmbanhmi';

                fetch('posts/' + post + '.md')
                    .then(r => {
                        if (!r.ok) throw new Error('not found');
                        return r.text();
                    })
                    .then(md => {
                        document.getElementById('post-body').innerHTML = marked.parse(md);
                    })
                    .catch(() => {
                        document.getElementById('post-body').innerHTML = '<p>post not found.</p>';
                    });
            }
        })();

        // ── Handwriting animation ──
        (function () {
            // Each stroke as a separate path, in drawing order
            const strokes = [
                'b-1', 'b-2',       // b: vertical, then belly
                'a-1', 'a-2',       // a: circle, then tail
                'n-1', 'n-2',       // n: vertical, then hump
                'h-1', 'h-2',       // h: vertical, then hump
                'm-1', 'm-2', 'm-3', // m: vertical, first hump, second hump
                'i-1', 'i-2'        // i: body, then dot
            ];

            // Duration each stroke takes to draw (ms)
            const drawDuration = 1000;
            // Small pause between strokes (ms)
            const strokeGap = 40;

            function initPaths() {
                strokes.forEach(id => {
                    const path = document.getElementById(id);
                    const len = path.getTotalLength();
                    path.style.strokeDasharray = len;
                    path.style.strokeDashoffset = len;
                    path.style.transition = 'none';
                });
            }

            // Track pending timers so we can cancel them on re-trigger
            let pendingTimers = [];

            function animateWrite() {
                // Cancel any in-progress animation
                pendingTimers.forEach(t => clearTimeout(t));
                pendingTimers = [];

                // Reset all strokes instantly
                strokes.forEach(id => {
                    const path = document.getElementById(id);
                    const len = path.getTotalLength();
                    path.style.transition = 'none';
                    path.style.strokeDashoffset = len;
                });

                // Force reflow
                void document.querySelector('.handwriting-svg').getBoundingClientRect();

                // Sequentially animate each stroke
                let cumDelay = 0;
                strokes.forEach((id, i) => {
                    const path = document.getElementById(id);
                    const len = path.getTotalLength();
                    // Scale duration proportionally to path length so short strokes don't drag
                    const dur = Math.max(150, drawDuration * (len / 80));

                    const timer = setTimeout(() => {
                        path.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                        path.style.strokeDashoffset = '0';
                    }, cumDelay);

                    pendingTimers.push(timer);
                    cumDelay += dur + strokeGap;
                });
            }

            // Initial setup & first animation
            window.addEventListener('DOMContentLoaded', () => {
                initPaths();
                // Small delay so the page settles
                setTimeout(animateWrite, 300);
            });

            // Re-play animation on hover (desktop) and touch/click (mobile)
            const card = document.getElementById('helloCard');
            card.addEventListener('mouseenter', animateWrite);
            card.addEventListener('click', animateWrite);
            card.addEventListener('touchstart', (e) => {
                e.preventDefault();
                animateWrite();
            }, { passive: false });
        })();

        // ── Substack feed ──
        const rssUrl = 'https://bnmbanhmi.substack.com/feed';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('substack-feed');
                container.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<p class="loading">nothing yet.</p>';
                    return;
                }

                const posts = data.items.slice(0, 3);

                posts.forEach(post => {
                    let dateObj = new Date(post.pubDate.replace(/-/g, '/'));
                    let pubDate = dateObj.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });

                    container.innerHTML += `
                        <div class="post-item">
                            <h3><a href="${post.link}" target="_blank">${post.title.toLowerCase()}</a></h3>
                            <span class="date">${pubDate}</span>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('substack-feed').innerHTML = '';
            });

        // ── Spotify Player ──
        const spotifyLink = 'https://open.spotify.com/track/456WNXWhDwYOSf5SpTuqxd?si=c63f8c5cfdcf4a49';

        function extractSpotifyId(url) {
            const match = url.match(/track\/([a-zA-Z0-9]+)/);
            return match ? match[1] : null;
        }

        function loadSpotifyTrack(url) {
            const container = document.getElementById('spotify-player-container');
            const trackId = extractSpotifyId(url) || '456WNXWhDwYOSf5SpTuqxd';
            const embedUrl = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator`;

            // 1. Fade out gracefully
            container.classList.remove('loaded');

            // 2. Wait for fade out animation (400ms) before swapping content
            setTimeout(() => {
                const iframe = document.createElement('iframe');
                iframe.setAttribute('data-testid', 'embed-iframe');
                iframe.style.borderRadius = '12px';
                iframe.src = embedUrl;
                iframe.width = '100%';
                iframe.height = '352';
                iframe.frameBorder = '0';
                iframe.allowFullscreen = '';
                iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
                iframe.loading = 'lazy';

                // 3. Fade back in once the new iframe is loaded
                iframe.onload = () => {
                    container.classList.add('loaded');
                };

                // Swap the iframe
                container.innerHTML = '';
                container.appendChild(iframe);

                // Fallback in case onload is slow or fails
                setTimeout(() => {
                    if (!container.classList.contains('loaded')) {
                        container.classList.add('loaded');
                    }
                }, 2000);

            }, 400);
        }

        // Initialize
        // Note: You can call loadSpotifyTrack(newUrl) anytime to smoothly transition to a new track
        loadSpotifyTrack(spotifyLink);
    </script>
</body>

</html>
